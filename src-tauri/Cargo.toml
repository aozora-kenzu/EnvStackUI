[package]
name = "envstack-ui"
version = "1.1.0"
description = "Portable Windows local web development environment and multi-runtime manager"
authors = ["AKZ Team"]
license = "MIT"
repository = "https://github.com/aozora-kenzu/EnvStackUI"
publish = false
edition = "2021"

[lib]
name = "envstack_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
zip = "2"
flate2 = "1"
tar = "0.4"
rcgen = "0.13"
chrono = { version = "0.4", features = ["serde"] }
semver = "1"
notify = "6"
futures-util = "0.3"
anyhow = "1"
winreg = "0.55"
